<!doctype html>
<!-- Plantilla del ícono. Se convierte a PNG con: npm run iconos -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Allura; src: url(../node_modules/@fontsource/allura/files/allura-latin-400-normal.woff2); }
@font-face { font-family: Josefin; font-weight: 600; src: url(../node_modules/@fontsource/josefin-sans/files/josefin-sans-latin-600-normal.woff2); }
html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: transparent; }
.i { width: 512px; height: 512px; border-radius: var(--r, 112px); background: radial-gradient(circle at 50% 30%, #1b2d57, #0d1a36 70%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
.n { font-family: Allura; font-size: 176px; color: #e2bd84; line-height: 0.8; margin-top: 30px; }
.l { display: flex; align-items: center; gap: 12px; width: 260px; color: #c4934f; margin-top: 18px; font-size: 18px; }
.l span { flex: 1; height: 2px; background: linear-gradient(90deg, transparent, #c4934f); }
.l span:last-child { transform: scaleX(-1); }
.s { font-family: Josefin; font-weight: 600; font-size: 26px; letter-spacing: 0.42em; padding-left: 0.42em; color: #f5eee3; margin-top: 12px; }
</style></head><body>
<div class="i"><div class="n">Zuréa</div><div class="l"><span></span>♡<span></span></div><div class="s">DESSERTS</div></div>
<script>if (location.hash === '#maskable') document.documentElement.style.setProperty('--r', '0')</script>
</body></html>
